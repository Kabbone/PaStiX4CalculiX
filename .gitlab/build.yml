---
.build_script_linux:
  stage: build
  tags: ['ci.inria.fr', 'linux', 'large']
  extends: .only-master-mr
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    SYSTEM: linux
  script:
    - bash .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 1 week
    untracked: true

build_seq:
  extends: .build_script_linux
  variables:
    VERSION: seq
    LOGNAME: "pastix-build-${SYSTEM}-${VERSION}"

build_mpi:
  extends: .build_script_linux
  variables:
    VERSION: mpi
    LOGNAME: "pastix-build-${SYSTEM}-${VERSION}"

.build_script_macosx:
  stage: build
  tags: ["macosx"]
  extends: .only-master-mr
  variables:
    SYSTEM: macosx
  script:
    - bash .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 1 week
    paths:
      - ${LOGNAME}.log
  cache:
    key: "${SYSTEM}-${VERSION}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_seq_macosx:
  extends: .build_script_macosx
  variables:
    VERSION: seq
    LOGNAME: "pastix-build-${SYSTEM}-${VERSION}"

build_mpi_macosx:
  extends: .build_script_macosx
  variables:
    VERSION: mpi
    LOGNAME: "pastix-build-${SYSTEM}-${VERSION}"

.build_script_windows:
  stage: build
  tags: ['windows']
  extends: .only-master-mr
  variables:
    SYSTEM: windows
    CHERE_INVOKING: "yes"
    MSYSTEM: UCRT64
  script:
    - bash -lc .gitlab/build.sh | tee "$env:LOGNAME.log"
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 1 week
    paths:
      - ${LOGNAME}.log
  cache:
    key: "${SYSTEM}-${VERSION}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_seq_windows:
  extends: .build_script_windows
  variables:
    VERSION: seq
    LOGNAME: "pastix-build-${SYSTEM}-${VERSION}"
